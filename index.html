<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Annakut Items Drop-off 2026 – Thank you</title>
<meta name="theme-color" content="#6E1B26">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#F4EFE8;color:#231A1B;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
main{min-height:100svh;display:grid;place-items:center;padding:28px max(20px,env(safe-area-inset-left)) 28px max(20px,env(safe-area-inset-right));text-align:center}
.box{max-width:440px;width:100%;background:#FFFDF9;border:1px solid #E3DAD0;border-top:6px solid #6E1B26;border-radius:20px;padding:28px 22px 24px;box-shadow:0 6px 24px rgba(60,30,20,.08)}
.baps{height:84px;width:auto}
.sp{color:#E8892B;letter-spacing:.4em;margin-top:12px}
h1{font-size:1.55rem;line-height:1.25;margin:12px 0 10px;color:#6E1B26}
p{margin:0 0 10px;font-size:1.05rem;line-height:1.5;color:#3A2A2B}
.go{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 24px;margin-top:12px;border-radius:999px;background:#6E1B26;color:#fff;font-weight:800;text-decoration:none;font-size:1.05rem}
.small{margin-top:14px;font-size:.88rem;color:#6B5E5A}
</style>
</head>
<body>
<main><div class="box">
  <img class="baps" src="baps-logo-maroon.webp" alt="BAPS">
  <div class="sp" aria-hidden="true">✦ ✦ ✦</div>
  <h1>Annakut 2026 item drop-off has finished</h1>
  <p>Thank you for your Annakut offerings to BAPS Shri Swaminarayan Mandir, Sydney. Jay Swaminarayan!</p>
  <a class="go" href="https://www.baps.org/sydney">Go to BAPS Sydney</a>
  <p class="small">Taking you to the BAPS Sydney page in <b id="n">6</b> seconds…</p>
</div></main>
<script>
/* remove the old offline drop-off guide (and its saved voice files) from this phone */
try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(rs=>rs.filter(r=>r.scope.indexOf("/annakut-dropoff/")>=0).forEach(r=>r.unregister()))}catch(e){}   /* only the Annakut one; the campus tour keeps its own */
try{caches&&caches.keys().then(ks=>ks.filter(k=>k.indexOf("annakut-dropoff-")===0).forEach(k=>caches.delete(k)))}catch(e){}
try{localStorage.removeItem("annakut.lang")}catch(e){}
/* then go to the BAPS Sydney page */
let n=6;const t=setInterval(()=>{n--;document.getElementById("n").textContent=n;if(n<=0){clearInterval(t);location.replace("https://www.baps.org/sydney")}},1000);
</script>
</body>
</html>
