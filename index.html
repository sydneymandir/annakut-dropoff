<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Annakut Items Drop-off</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#6E1B26">
<meta name="description" content="Route and times for dropping off Annakut items at BAPS Shri Swaminarayan Mandir, Kemps Creek.">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* One warm, light column: maroon and saffron of the Mandir, drone map with the route drawn on it, big tap targets. */
:root{
  --stone:#F4EFE8; --paper:#FFFDF9; --ink:#231A1B; --muted:#6B5E5A; --line:#E3DAD0;
  --maroon:#6E1B26; --maroon2:#8E2A36; --saffron:#E8892B; --saffron-soft:#FDEBD6; --ok:#2E7D4F;
  --route:#F28C28;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Gujarati",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--stone);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--maroon)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button,a,.mk{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--maroon);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.logo{width:34px;height:34px;flex:none;border-radius:50%;background:var(--saffron);display:grid;place-items:center}
.logo svg{width:22px;height:22px}
header.top h1{font-size:1.1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top small{display:block;font-size:.72rem;font-weight:500;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-weight:700;flex:none}
.hbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

/* language chooser */
.langv{padding-block:28px 40px}
.langv h2{font-size:1.4rem;color:var(--maroon);margin-bottom:16px;text-align:center}
.langlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.langlist button{width:100%;min-height:62px;border-radius:16px;border:1.5px solid var(--line);background:var(--paper);font-size:1.3rem;font-weight:700;color:var(--maroon);box-shadow:0 2px 6px rgba(60,30,20,.06)}
.langlist button[aria-current="true"]{border-color:var(--maroon);background:var(--saffron-soft)}

/* status + intro */
.status{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line);font-weight:700}
.status .dot{width:12px;height:12px;border-radius:50%;background:var(--saffron);flex:none}
.status.live{background:#E9F6EE;border-color:#BFE3CC;color:#1F5A38}
.status.live .dot{background:var(--ok);box-shadow:0 0 0 0 rgba(46,125,79,.5);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(46,125,79,0)}100%{box-shadow:0 0 0 0 rgba(46,125,79,0)}}
.intro{margin:12px 0 0;color:var(--muted)}
h2.sec{font-size:1.05rem;color:var(--maroon);margin:20px 0 10px}

/* day tabs */
.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 8px}
@media (min-width:520px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}
.day{min-height:64px;padding:8px 4px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;line-height:1.2;display:grid;place-items:center;text-align:center;position:relative;overflow-wrap:anywhere}
.day[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff}
.day small{display:block;font-weight:600;font-size:.8rem;opacity:.85;margin-top:2px}
.day .tag{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;font-size:.66rem;padding:1px 8px;border-radius:999px;white-space:nowrap}

/* place card */
.place{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(60,30,20,.06)}
.place .head{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.star{width:44px;height:44px;border-radius:50%;background:var(--saffron);color:#fff;display:grid;place-items:center;font-size:1.3rem;box-shadow:0 0 0 4px var(--saffron-soft)}
.place h3{font-size:1.2rem;color:var(--maroon)}
.place .sub{font-size:.9rem;color:var(--muted)}
.times{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--saffron-soft)}
.times b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:#8A4A10}
:is(:lang(hi),:lang(gu),:lang(ne)) .times b{text-transform:none;letter-spacing:0;font-size:.9rem}
.times ul{margin:4px 0 0;padding:0;list-style:none;font-size:1.15rem;font-weight:800}
.times .tbc{margin:4px 0 0;font-weight:600;color:#6d4b2b}
.items{margin-top:10px;padding:12px 14px;border-radius:12px;background:#EEF6F0;border:1px solid #CFE6D7;display:grid;grid-template-columns:24px 1fr;gap:10px}
.items.no{background:#FFF1EE;border-color:#F3CFC6}
.items svg{width:22px;height:22px;stroke:#2E7D4F;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.items.no svg{stroke:#B3412E}
.items b{display:block;font-size:.8rem;color:var(--muted)}
.items span{font-weight:700}
.status{align-items:flex-start}
.status .dot{margin-top:7px}
.status .rule{display:block;font-weight:600;font-size:.92rem;margin-top:2px}
.status .rule.no{color:#A3361F}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:999px;border:1.5px solid var(--maroon);background:var(--paper);color:var(--maroon);font-weight:700;text-decoration:none}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.solid{background:var(--maroon);color:#fff}
.btn.small{min-height:38px;padding:0 12px;font-size:.88rem}
.place .btn{margin-top:12px}

/* map */
.mapbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px auto 8px}
.mapbar h2{font-size:1.05rem;color:var(--maroon)}
.mapwrap{position:relative}
.mapscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;border-block:1px solid var(--line);background:#9a948c}
.mapinner{display:flex;height:var(--maph,250px);width:max-content}
.map{position:relative;height:100%;aspect-ratio:5099/1353}
.map img{display:block;width:100%;height:100%;cursor:zoom-in}
.nogo{position:absolute;top:6%;bottom:6%;left:84.3%;right:0;display:grid;place-items:center;text-align:center;padding:8px;font-size:.72rem;font-weight:700;color:#3A2E2F;background:repeating-linear-gradient(135deg,rgba(239,236,231,.35) 0 10px,rgba(110,27,38,.35) 10px 12px);border-left:2px dashed rgba(110,27,38,.6);pointer-events:none}
.nogo span{background:rgba(255,255,255,.92);padding:6px 8px;border-radius:8px;line-height:1.3}
svg.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.route .under{stroke:#fff;stroke-width:11px;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
svg.route .line{stroke:var(--route);stroke-width:6px;fill:none;stroke-linecap:round;stroke-linejoin:round}
svg.route .flow{stroke:#fff;stroke-width:2.5px;fill:none;stroke-dasharray:3 14;stroke-linecap:round;animation:flow 1.1s linear infinite}
svg.route .walk{stroke:var(--maroon);stroke-width:4px;fill:none;stroke-dasharray:2 7;stroke-linecap:round}
svg.route .walkU{stroke:#fff;stroke-width:8px;fill:none;stroke-linecap:round}
@keyframes flow{to{stroke-dashoffset:-17}}
@media (prefers-reduced-motion:reduce){svg.route .flow{animation:none}.status.live .dot{animation:none}}
.mk{position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;border:0;padding:0;pointer-events:none}
.mk.step{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--maroon);font-weight:800;font-size:.85rem;border:2.5px solid var(--maroon);box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .25s}
.mk.step.on{transform:translate(-50%,-50%) scale(1.35);background:var(--maroon);color:#fff}
.mk.gate{width:30px;height:30px;border-radius:8px;background:var(--maroon);color:#fff;font-weight:800;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.mk.dest{width:40px;height:40px;border-radius:50%;background:var(--saffron);color:#fff;font-size:1.2rem;border:3px solid #fff;box-shadow:0 0 0 0 rgba(232,137,43,.7),0 2px 8px rgba(0,0,0,.45);animation:ring 1.8s infinite}
@keyframes ring{70%{box-shadow:0 0 0 16px rgba(232,137,43,0),0 2px 8px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 0 rgba(232,137,43,0),0 2px 8px rgba(0,0,0,.45)}}
@media (prefers-reduced-motion:reduce){.mk.dest{animation:none}}
.chip{position:absolute;transform:translate(-50%,0);white-space:nowrap;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(255,253,249,.96);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.35);pointer-events:none}
.chip.dest{background:var(--saffron);color:#fff}
.compass{position:absolute;top:8px;right:max(10px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.3);display:grid;place-items:center;pointer-events:none;z-index:2}
.compass svg{width:30px;height:30px}

/* full-screen map */
.fsui{display:none}
.fslock,.fslock body{overflow:hidden;overscroll-behavior:none}
.mapwrap.fs{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:#26232e}
.mapwrap.fs .mapscroll{flex:1;display:flex;overflow:auto;border:0;touch-action:pan-x pan-y;overscroll-behavior:contain;scroll-behavior:auto;background:#26232e}
.mapwrap.fs .mapinner{height:var(--fsh,500px);margin:auto;flex:none}
.mapwrap.fs .map img{cursor:grab}
.mapwrap.fs .compass{top:calc(env(safe-area-inset-top,0px) + 64px);right:max(12px,env(safe-area-inset-right,0px))}
.mapwrap.fs .fsui{display:block}
.fsbar{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(20,17,30,.82),rgba(20,17,30,0));pointer-events:none}
.fsbar>*{pointer-events:auto}
.fsbtn{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.96);color:#1E1A2B;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.35);flex:none}
.fsbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.fsbtn:active{transform:scale(.94)}
.fsbar .fstitle{color:#fff;font-weight:800;font-size:1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.fszoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:3;display:grid;gap:10px}
.fshint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:2;background:rgba(20,17,30,.78);color:#fff;font-size:.8rem;padding:6px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.fshint.gone{opacity:0}

/* steps */
.hint{margin:-4px 0 10px;font-size:.88rem;color:var(--muted)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ol.steps button{width:100%;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);line-height:1.45}
ol.steps button[aria-current="true"]{border-color:var(--maroon);background:#FBF3EC}
ol.steps .n{width:32px;height:32px;border-radius:50%;background:var(--maroon);color:#fff;font-weight:800;display:grid;place-items:center}
ol.steps li.last .n{background:var(--saffron)}
.note{display:grid;grid-template-columns:24px 1fr;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;background:#FFF6E0;border:1px solid #F1D9A3;font-size:.95rem}
.note svg{width:22px;height:22px;stroke:#A0640B;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.addr{margin-top:22px;padding:16px;border-radius:18px;background:var(--paper);border:1px solid var(--line)}
.addr p{margin:2px 0 12px}
.addr b{color:var(--maroon)}
footer{padding:22px 0 calc(env(safe-area-inset-bottom,0px) + 30px);text-align:center;font-size:.8rem;color:var(--muted)}
.net::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}

/* finished */
.closedv{padding-block:60px;text-align:center}
.closedv .star{margin:0 auto 18px;width:72px;height:72px;font-size:2rem}
.closedv h2{color:var(--maroon);font-size:1.5rem;margin-bottom:10px}
.closedv p{color:var(--muted);font-size:1.05rem}
@media (min-width:600px){.mapinner{--maph:300px}}
</style>
</head>

const DAYS = [
  { id:"d1", date:"2026-10-31", start:"12:00", end:"17:00", plan:"A", occ:"o1", rule:"rDry" },
  { id:"d2", date:"2026-11-06", start:"16:30", end:"19:00", plan:"B", occ:"o2", rule:"rDryAll" },
  { id:"d3", date:"2026-11-08", start:"15:00", end:"19:00", plan:"B", occ:"o3", rule:"rDryAll" },
  { id:"d4", date:"2026-11-10", start:"06:00", end:"09:00", plan:"B", occ:"o4", rule:"rAll" }
];
const LIVE_UNTIL = "2026-11-10";   // after this Sydney date the guide shows a "finished, thank you" page

/* Map positions are pixels on the 5099 x 1353 drone map (same map as the campus tour). */
const MAPW=5099, MAPH=1353, GATE=[281,160];
const PLANS = {
  A:{ name:"pA", sub:"pAs", note:"noteA", destKey:"dropA",
      route:[[281,160],[1100,170],[1940,172],[1940,330],[1942,500]], walk:[[1942,500],[2150,505]], dest:[2177,505],
      steps:[GATE,[1100,170],[1940,300],[2177,505],GATE] },
  B:{ name:"pB", sub:"pBs", note:"noteB", destKey:"dropB",
      route:[[281,160],[1940,172],[2700,168],[3015,168],[3018,262]], walk:null, dest:[3018,280],
      steps:[GATE,[2450,166],[2860,168],[3018,280],GATE] }
};

const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("annakut.lang",null), day=null, step=null, zoomLoaded=false;
const L=()=>CONTENT[lang]||CONTENT.en;
function ui(k,v){let t=L().ui[k]??CONTENT.en.ui[k]??k;if(v)for(const x in v)t=t.replace("{"+x+"}",v[x]);return t}

/* today's date in Sydney, from the phone clock (works offline). ?date=2026-11-07 to preview another day. */
function sydToday(){
  const q=new URLSearchParams(location.search).get("date"); if(q&&/^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
  try{return new Intl.DateTimeFormat("en-CA",{timeZone:"Australia/Sydney",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
  catch(e){const d=new Date(Date.now()+11*3600e3);return d.toISOString().slice(0,10)}
}
function sydTime(){
  const q=new URLSearchParams(location.search).get("time"); if(q&&/^\d{2}:\d{2}$/.test(q)) return q;
  try{return new Intl.DateTimeFormat("en-GB",{timeZone:"Australia/Sydney",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date()).replace(/^24/,"00")}
  catch(e){return new Date(Date.now()+11*3600e3).toISOString().slice(11,16)}
}
function fmtT(t){let [h,m]=t.split(":").map(Number);const ap=h>=12?"pm":"am";h=h%12||12;return h+":"+String(m).padStart(2,"0")+" "+ap}
const span=d=>fmtT(d.start)+" – "+fmtT(d.end);
const isPast=(d,today,now)=>d.date<today||(d.date===today&&now>=d.end);
const dayIdx=d=>DAYS.indexOf(d)+1;
const dayLabel=(d,long)=>ui((long?"dl":"d")+dayIdx(d));

function defaultDay(today){
  const h=location.hash.slice(1), byHash=DAYS.find(d=>d.id===h); if(byHash) return byHash;
  const now=sydTime(); return DAYS.find(d=>!isPast(d,today,now))||DAYS[DAYS.length-1];
}

function pct(p){return `left:${p[0]/MAPW*100}%;top:${p[1]/MAPH*100}%`}
function drawMap(){
  const P=PLANS[day.plan], pts=a=>a.map(p=>p.join(",")).join(" ");
  let s=`<polyline class="under" vector-effect="non-scaling-stroke" points="${pts(P.route)}"/><polyline class="line" vector-effect="non-scaling-stroke" points="${pts(P.route)}"/><polyline class="flow" vector-effect="non-scaling-stroke" points="${pts(P.route)}"/>`;
  if(P.walk) s+=`<polyline class="walkU" vector-effect="non-scaling-stroke" points="${pts(P.walk)}"/><polyline class="walk" vector-effect="non-scaling-stroke" points="${pts(P.walk)}"/>`;
  $("routeSvg").innerHTML=s;
  let m=`<span class="mk gate" style="${pct(GATE)}">G</span><span class="chip" style="${pct([GATE[0],GATE[1]+70])}">${ui("gate")}</span>`;
  P.steps.forEach((p,i)=>{ if(i===0||i===P.steps.length-1||i===3) return; m+=`<span class="mk step" data-i="${i}" style="${pct(p)}">${i+1}</span>` });
  m+=`<span class="mk dest" style="${pct(P.dest)}">★</span><span class="chip dest" style="${pct([P.dest[0],P.dest[1]+90])}">${ui(P.destKey)}</span>`;
  $("marks").innerHTML=m;
}
function scrollMapTo(p,smooth){
  const sc=$("mapScroll"), m=$("map");
  const x=p[0]/MAPW*m.clientWidth-sc.clientWidth*(p===PLANS[day.plan].dest?.68:.5);
  if(FS.on){fsCenter(p[0],p[1]);return}
  sc.scrollTo({left:Math.max(0,x),behavior:smooth?"smooth":"auto"});
}

function render(){
  document.documentElement.lang=lang;
  $("langShort").textContent=(LANGS.find(l=>l.code===lang)||LANGS[0]).short;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=ui(e.dataset.t));
  document.querySelectorAll("[data-th]").forEach(e=>e.innerHTML=ui(e.dataset.th));
  document.title=ui("title");
  const today=sydToday();
  if(!day) day=defaultDay(today);
  if(today>LIVE_UNTIL){$("homeView").hidden=true;$("closedView").hidden=false;return}
  $("closedView").hidden=true; $("homeView").hidden=false;
  if(!day) day=defaultDay(today);
  /* status line */
  const now=sydTime(), cur=DAYS.find(d=>!isPast(d,today,now)), st=$("status");
  const where=d=>ui(PLANS[d.plan].name);
  st.classList.toggle("live",!!cur&&cur.date===today);
  if(!cur){$("statusText").textContent=ui("stDone");$("statusRule").textContent=""}
  else{
    const o=ui(cur.occ);
    $("statusText").textContent= cur.date!==today ? ui("stNext",{d:dayLabel(cur,true),o,t:span(cur)})+" · "+where(cur)
      : now<cur.start ? ui("stToday",{o,t:span(cur)})+" · "+where(cur) : ui("stOpen",{o,e:fmtT(cur.end)})+" · "+where(cur);
    $("statusRule").textContent=ui(cur.rule);
    $("statusRule").classList.toggle("no",cur.rule==="rDry");
  }
  /* day tabs */
  $("days").innerHTML=DAYS.map(d=>`<button class="day" data-day="${d.id}" aria-pressed="${d===day}">${d.date===today?`<span class="tag">${ui("today")}</span>`:""}<span>${dayLabel(d)}<small>${ui(d.occ)}</small></span></button>`).join("");
  /* place card */
  const P=PLANS[day.plan];
  $("pName").textContent=ui(P.name);
  $("pSub").textContent=dayLabel(day,true)+" · "+ui(day.occ)+" · "+ui(P.sub);
  $("timeList").innerHTML=`<li>${span(day)}</li>`;
  $("itemsText").textContent=ui(day.rule);
  $("items").classList.toggle("no",day.rule==="rDry");
  $("itemsIcon").setAttribute("d",day.rule==="rDry"?"M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 7.5v6M12 16.5v.5":"M5 12.5 10 17 19 7");
  /* steps */
  const pre=day.plan;
  $("steps").innerHTML=[1,2,3,4,5].map(i=>`<li class="${i===4?"last":""}"><button data-step="${i-1}" aria-current="${step===i-1}"><span class="n">${i===4?"★":i}</span><span>${ui(pre+i)}</span></button></li>`).join("");
  $("note").textContent=ui(P.note);
  $("addr").textContent=INFO.address;
  $("dirBtn").href=INFO.maps;
  $("fsTitle").textContent=ui(P.name);
  drawMap(); markStep();
  net();
}
function markStep(){document.querySelectorAll(".mk.step").forEach(e=>e.classList.toggle("on",+e.dataset.i===step))}

function chooseDay(id){
  day=DAYS.find(d=>d.id===id)||day; step=null; stopSpeech(); render();
  try{history.replaceState(null,"","#"+day.id)}catch(e){}
  requestAnimationFrame(()=>scrollMapTo(PLANS[day.plan].dest,true));
}
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-day]"); if(d){chooseDay(d.dataset.day);return}
  const s=e.target.closest("[data-step]"); if(s){
    step=+s.dataset.step; document.querySelectorAll("[data-step]").forEach(b=>b.setAttribute("aria-current",b===s)); markStep();
    const p=PLANS[day.plan].steps[step]; scrollMapTo(p,true);
    const mt=document.querySelector(".mapbar"); if(mt.getBoundingClientRect().top<0||mt.getBoundingClientRect().top>innerHeight*.5) mt.scrollIntoView({behavior:"smooth",block:"start"});
  }
});

/* ===== language chooser ===== */
function showLang(){
  $("langList").innerHTML=LANGS.map(l=>`<li><button lang="${l.code}" data-lang="${l.code}" aria-current="${l.code===lang}">${l.name}</button></li>`).join("");
  document.querySelectorAll("#langList button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("annakut.lang",lang);$("langView").hidden=true;render();window.scrollTo(0,0);requestAnimationFrame(()=>scrollMapTo(PLANS[day.plan].dest))});
  $("homeView").hidden=true; $("closedView").hidden=true; $("langView").hidden=false; window.scrollTo(0,0);
}
$("langBtn").onclick=()=>{stopSpeech();showLang()};

/* ===== read aloud (phone's own voices) ===== */
let speakingBtn=null;
function pickVoice(){
  const meta=LANGS.find(l=>l.code===lang)||LANGS[0], vs=speechSynthesis.getVoices();
  for(const want of meta.speech){const v=vs.find(v=>v.lang.replace("_","-").toLowerCase()===want.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(want.toLowerCase()));if(v)return{voice:v,none:false}}
  return{voice:null,none:vs.length>0};
}
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){} if(speakingBtn){speakingBtn.querySelector(".lbl").textContent=ui("listen");speakingBtn.setAttribute("aria-pressed","false")} speakingBtn=null}
function sayText(){
  const end=t=>/[.।?!]$/.test(t.trim())?t:t+(lang==="en"?".":"।"), P=PLANS[day.plan];
  const parts=[ui(P.name), dayLabel(day,true)+", "+ui(day.occ), ui("timeL")+": "+span(day).replace(/am/g,"a.m.").replace(/pm/g,"p.m."), ui("itemsL")+": "+ui(day.rule)];
  for(let i=1;i<=5;i++) parts.push(i+". "+ui(day.plan+i));
  parts.push(ui(P.note));
  return parts.map(end).join(" ").replace(/–/g," to ");
}
document.addEventListener("click",e=>{
  const btn=e.target.closest("[data-say]"); if(!btn) return;
  if(speakingBtn===btn){stopSpeech();return}
  stopSpeech();
  if(!("speechSynthesis" in window)){btn.querySelector(".lbl").textContent=ui("noSpeech");return}
  const pv=pickVoice(); if(pv.none){btn.querySelector(".lbl").textContent=ui("noVoice");return}
  const meta=LANGS.find(l=>l.code===lang)||LANGS[0], u=new SpeechSynthesisUtterance(sayText());
  u.lang=pv.voice?pv.voice.lang:meta.speech[0]; if(pv.voice)u.voice=pv.voice; u.rate=.95;
  u.onend=u.onerror=()=>{if(speakingBtn===btn)stopSpeech()};
  speechSynthesis.speak(u); speakingBtn=btn; btn.querySelector(".lbl").textContent=ui("stop"); btn.setAttribute("aria-pressed","true");
});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}

function net(){$("net").textContent=ui("offline")}

/* ===== Full-screen map: drag to move, pinch / double-tap / + − to zoom, phone Back closes it ===== */
const FS={on:false,h:0,skipPop:false};
const mapWrap=document.querySelector(".mapwrap"), mapSc=$("mapScroll");
let wakeLock=null;
async function keepAwake(){try{if(navigator.wakeLock&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>{wakeLock=null})}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&FS.on)keepAwake()});
function fsBounds(){const vw=mapSc.clientWidth||innerWidth, vh=mapSc.clientHeight||innerHeight;return{vw,vh,min:Math.min(vh,vw*MAPH/MAPW),max:MAPH}}
function fsZoomImg(){if(zoomLoaded)return;const img=$("mapImg"),z=new Image();z.onload=()=>{img.src=z.src;zoomLoaded=true};z.src=img.dataset.zoom}
function setFsH(h,fx,fy){
  const b=fsBounds(); h=Math.max(b.min,Math.min(b.max,h));
  const old=FS.h||h, k=h/old, sl=mapSc.scrollLeft, st=mapSc.scrollTop;
  fx=fx??b.vw/2; fy=fy??b.vh/2;
  FS.h=h; mapWrap.style.setProperty("--fsh",h+"px");
  mapSc.scrollLeft=(sl+fx)*k-fx; mapSc.scrollTop=(st+fy)*k-fy;
  if(h>460) fsZoomImg();
}
function fsCenter(x,y){const m=$("map");mapSc.scrollLeft=x/MAPW*m.clientWidth-mapSc.clientWidth/2;mapSc.scrollTop=y/MAPH*m.clientHeight-mapSc.clientHeight/2}
function fsEnter(pt){
  if(FS.on) return;
  const m=$("map"), P=PLANS[day.plan], c=pt||[P.dest[0]-500,MAPH*.4];
  FS.on=true; FS.h=0; mapWrap.classList.add("fs"); document.documentElement.classList.add("fslock");
  try{history.pushState({fs:1},"")}catch(e){}
  {const b=fsBounds();setFsH(pt?b.vh*1.1:Math.max(MAPH*b.vw/2300,Math.min(b.vh*.7,MAPH*b.vw/1500)))} fsCenter(c[0],c[1]);
  const hint=mapWrap.querySelector(".fshint"); hint.classList.remove("gone");clearTimeout(FS.ht);FS.ht=setTimeout(()=>hint.classList.add("gone"),3500);
  keepAwake(); mapWrap.querySelector(".fsclose").focus({preventScroll:true});
}
function fsExit(fromPop){
  if(!FS.on) return;
  const m=$("map"), rx=(mapSc.scrollLeft+mapSc.clientWidth/2)/m.clientWidth;
  FS.on=false; mapWrap.classList.remove("fs"); document.documentElement.classList.remove("fslock");
  mapSc.scrollTop=0; mapSc.scrollLeft=rx*m.clientWidth-mapSc.clientWidth/2;
  if(wakeLock){try{wakeLock.release()}catch(e){}}
  if(!fromPop){FS.skipPop=true;try{history.back()}catch(e){FS.skipPop=false}}
}
addEventListener("popstate",()=>{if(FS.skipPop){FS.skipPop=false;return} if(FS.on)fsExit(true)});
let pz=null;
mapSc.addEventListener("touchstart",e=>{if(FS.on&&e.touches.length===2){const[a,b]=e.touches;pz={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,h:FS.h}}},{passive:true});
mapSc.addEventListener("touchmove",e=>{if(!pz||e.touches.length!==2)return;e.preventDefault();const[a,b]=e.touches,r=mapSc.getBoundingClientRect();setFsH(pz.h*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pz.d,(a.clientX+b.clientX)/2-r.left,(a.clientY+b.clientY)/2-r.top)},{passive:false});
mapSc.addEventListener("touchend",e=>{if(e.touches.length<2)pz=null},{passive:true});
mapSc.addEventListener("wheel",e=>{if(!FS.on||!e.ctrlKey)return;e.preventDefault();const r=mapSc.getBoundingClientRect();setFsH(FS.h*Math.exp(-e.deltaY*.01),e.clientX-r.left,e.clientY-r.top)},{passive:false});
mapSc.addEventListener("dblclick",e=>{if(!FS.on)return;const r=mapSc.getBoundingClientRect();setFsH(FS.h*1.8,e.clientX-r.left,e.clientY-r.top)});
$("mapImg").addEventListener("click",e=>{if(!FS.on){const m=$("map").getBoundingClientRect();fsEnter([(e.clientX-m.left)/m.width*MAPW,(e.clientY-m.top)/m.height*MAPH])}});
mapWrap.querySelector(".fsclose").onclick=()=>fsExit();
mapWrap.querySelector(".fsin").onclick=()=>setFsH(FS.h*1.5);
mapWrap.querySelector(".fsout").onclick=()=>setFsH(FS.h/1.5);
document.querySelectorAll(".mapopen").forEach(b=>b.onclick=()=>fsEnter());
document.addEventListener("keydown",e=>{if(FS.on&&e.key==="Escape")fsExit()});
addEventListener("resize",()=>{if(FS.on)setFsH(FS.h)});
addEventListener("hashchange",()=>{const d=DAYS.find(x=>x.id===location.hash.slice(1));if(d&&d!==day)chooseDay(d.id)});

/* ===== start ===== */
if(!lang||!CONTENT[lang]){lang="en";showLang()} else {render();requestAnimationFrame(()=>scrollMapTo(PLANS[day.plan].dest))}
setInterval(()=>{if($("langView").hidden){const keep=step;render();step=keep}},60000);

/* save for offline use */
if("serviceWorker" in navigator && location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
</script>

</body>
</html>
